name: arm64-emulator-verify

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'stage1=boot+install+login-wait'
        required: false
        default: 'stage1'

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 55
    env:
      ANDROID_HOME: /Users/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (arm64 mac)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "emulator" "platforms;android-34" "system-images;android-34;google_apis;arm64-v8a"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Create AVD
        run: |
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test -k "system-images;android-34;google_apis;arm64-v8a" -d pixel_5

      - name: Boot emulator
        run: |
          nohup $ANDROID_HOME/emulator/emulator -avd test -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim > /tmp/emu.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$b" = "1" ]; then echo "BOOT COMPLETED"; break; fi
            sleep 10
          done
          adb shell getprop ro.product.cpu.abilist

      - name: Patch WeChat 8.0.80 with Nuke
        run: |
          wget -q "https://dldir1v6.qq.com/weixin/android/weixin8080android3220_0x28005032_arm64.apk" -O weixin.apk
          ls -la weixin.apk
          java -jar lspatch.jar weixin.apk -m nuke.apk -o patched.apk --force || java -jar lspatch.jar weixin.apk -m nuke.apk -o patched.apk
          ls -la patched.apk

      - name: Install and launch WeChat
        run: |
          adb install -r -g patched.apk
          adb logcat -c
          adb shell monkey -p com.tencent.mm -c android.intent.category.LAUNCHER 1
          sleep 45
          adb logcat -d > logcat.txt || true
          echo "## LSPatch / Nuke lines" > summary.md
          grep -E "LSPatch|LSPosed|Nuke|nuke" logcat.txt | head -60 >> summary.md || true
          cat summary.md

      - name: Wait for WeChat login (scan QR) and record Nuke status
        run: |
          for i in $(seq 1 90); do
            focus=$(adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus" | tr -d '\r')
            echo "[$i] $focus"
            if echo "$focus" | grep -q "LauncherActivity\|MMMainActivity\|MainUITabActivity"; then
              echo "LOGGED IN"
              break
            fi
            adb exec-out screencap -p > screen.png 2>/dev/null || true
            sleep 10
          done
          adb exec-out screencap -p > final-screen.png || true
          adb logcat -d > final-logcat.txt || true
          grep -iE "nuke" final-logcat.txt | head -80 > nuke-log.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: |
            logcat.txt
            final-logcat.txt
            nuke-log.txt
            screen.png
            final-screen.png
            /tmp/emu.log
          if-no-files-found: warn
